<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>B7Burger</title>
    <link rel="stylesheet" href="assets/style.css" type="text/css">
</head>
<body>
    <header>
        <div class="container">
            <div class="logo">
                <a href="">B7 <span>•</span> Burger</a>
            </div>
            <nav>
                <ul class="leftside">
                    <li><a href="">Início</a></li>
                    <li><a href="">Burguers</a></li>
                    <li><a href="">Contato</a></li>
                </ul>
                <div class="rightside">
                    <a href="" class="button">Fazer pedido</a>
                </div>
            </nav>
            <div class="menuMobile">
                <div class="menu-icon">
                    <div></div>
                    <div></div>
                    <div></div>
                </div>
            </div>
        </div>
    </header>
    <section class="hero">
        <div class="container">
            <div class="leftside">
                <h1>O Hambuguer mais delicioso.😋</h1>
                <p>A primeira hamburgueria virtual que você faz o pedido online e come o burguer através do computador.</p>
                <a href="" class="button">Fazer pedido</a>
            </div>
            <div class="rightside">
                <img src="assets/img/heroBurger.png" alt="Burguer delicioso">
            </div>
        </div>
    </section>
    <section class="search">
        <div class="container">
            <div class="title">Pesquise o seu<br />Hamburguer favorito!</div>
            <div class="sides">
                <div class="leftside">
                    <input type="search" placeholder="Digite o nome do Burguer" />
                </div>
                <div class="rightside">
                    <select>
                        <option value="">Selecionar categoria</option>
                        <option value="hamburguer">Hamburguer</option>
                        <option value="refri">Refrigerantes</option>
                        <option value="vegetariano">Vegetariano</option>
                        <option value="acai">Açaí</option>
                    </select>
                </div>
            </div>
        </div>
    </section>
</body>
</html>
